<div class="home-page">

  <div class="banner" *appShowAuthed="false">
    <div class="container">
      <h1>forum</h1>
      <p>A place to share your Angular knowledge.</p>
    </div>
  </div>

  <div class="container">
    <div class="feed-layout">

      <div class="feed-main">
        <mat-tab-group (selectedTabChange)="onTabChange($event)" [selectedIndex]="selectedTab()">
          <mat-tab label="Your Feed" *appShowAuthed="true"></mat-tab>
          <mat-tab label="Global Feed"></mat-tab>
          @if (listConfig().filters.tag) {
            <mat-tab [label]="'# ' + listConfig().filters.tag"></mat-tab>
          }
        </mat-tab-group>

        <app-article-list [limit]="10" [config]="listConfig()"></app-article-list>
      </div>

      <div class="feed-sidebar">
        <mat-card class="sidebar-card">
          <mat-card-header>
            <mat-card-title style="font-size: 1rem">Popular Tags</mat-card-title>
          </mat-card-header>
          <mat-card-content>
            @if (tags | async; as tagList) {
              <mat-chip-listbox>
                @for (tag of tagList; track tag) {
                  <mat-chip
                    (click)="setListTo('all', {tag: tag})"
                    class="tag-chip">
                    {{ tag }}
                  </mat-chip>
                }
              </mat-chip-listbox>

              @if (tagList.length === 0) {
                <p style="opacity: 0.6; font-size: 0.9rem">
                  No tags are here... yet.
                </p>
              }
            } @else {
              <div style="padding: 8px 0">
                <mat-progress-bar mode="indeterminate"></mat-progress-bar>
              </div>
            }
          </mat-card-content>
        </mat-card>
      </div>

    </div>
  </div>
</div>
